name: Update APIs and Playlists

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        env:
          API_URL: ${{ secrets.API_URL }}
        run: python app.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f apis.json ]; then git add apis.json; fi
          if [ -f ns_player.m3u ]; then git add ns_player.m3u; fi
          if [ -f ott_nav_player.m3u ]; then git add ott_nav_player.m3u; fi
          if [ -f ott_nav_player.m3u ]; then git add ott_nav_player.m3u; fi
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update apis.json and playlists" && git push)
